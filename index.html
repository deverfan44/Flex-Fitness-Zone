<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Fitness zone</title>
    <!-- FontAwesome Cdn  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font Cdn  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Tailwind Cdn  -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'title': '#01081B',
                        'description': '#4D525F',
                        'btn-primary': '#2E68FD',
                        'backcolor': '#F6F6F6',
                        'short-title': '#932EFA',

                    },
                    fontFamily: {
                    'urbanist': ['Urbanist', 'serif'],
                    'outfit': ['Outfit', 'serif']
                    },

                }
            }
            }
    </script>
</head>
<body class="font-[urbanist]">
    <!-- Project Set up done -->

    <!-- Header Section  -->
    <header class="mx-5 mt-5 pt-5 rounded-2xl bg-[url(./images/bg_hero.png)] bg-cover bg-center">
        <section class="max-w-[1170px] md:px-5 mx-auto">
            <!-- Nav Section -->
            <nav class="flex justify-between items-center">
                <!-- brands logo  -->
                <div class="flex items-center">
                    <div class="md:hidden block md:mr-0 mr-3">
                        <a href="#"><i class="fa-solid fa-bars text-2xl"></i></a>
                    </div>
                    <div class="flex items-center gap-x-2">
                        <img src="./images/headerlogo.png" alt="Logo">
                        <h2 class="text-2xl md:text-3xl font-bold">Monks Pay</h2>
                    </div>
                </div>
                <!-- Menu section  -->
                <div class="hidden md:block">
                    <ul class="flex font-semibold text-description">
                        <li><a href="#" class="px-4 py-2">Features</a></li>
                        <li><a href="#" class="px-4 py-2">Pricing</a></li>
                        <li><a href="#" class="px-4 py-2">Security</a></li>
                        <li><a href="#" class="px-4 py-2">Benefits</a></li>
                    </ul>
                </div>
                <!-- header button  -->
                <div>
                    <button class="px-4 py-2 md:px-6 md:py-3 bg-btn-primary text-[16px] rounded-full font-semibold text-white">Buy Template</button>
                </div>
            </nav>

            <!-- Hero section  -->
            <div class="flex flex-col lg:flex-row lg:items-center pt-12 lg:py-0 gap-y-10">
                <!-- hero content  -->
                <div class="md:basis-1/2 flex flex-col items-center lg:items-start">
                    <p class="text-short-title font-semibold text-[16px]">EASY PAYMENT</p>
                    <h1 class="text-3xl md:text-6xl font-bold text-title mt-2 mb-4 leading-10 lg:text-left text-center">Pay fast and smarter from anywhere</h1>
                    <p class="text-description w-3/4 font-outfit font-normal lg:text-left text-center">Experience the future of payments: fast, secure, and tailored for the next generation's convenience and trust.</p>
                    <!-- hero button  -->
                    <div class="flex items-center gap-2 mt-12">
                        <div>
                            <button class="flex items-center gap-x-3 bg-black text-white px-4 py-2 rounded-lg">
                                <i class="fa-brands fa-apple text-5xl"></i>
                                <div>
                                    <p class="text-xs text-left">Download on the</p>
                                    <h4 class="text-xl">App Store</h4>
                                </div>
                            </button>
                        </div>
                        <div>
                            <button class="flex items-center gap-x-3 bg-black text-white px-4 py-2 rounded-lg">
                                <i class="fa-brands fa-google-play text-4xl"></i>
                                <div>
                                    <p class="text-xs text-left">GET IT ON</p>
                                    <h4 class="text-xl">Google Play</h4>
                                </div>
                            </button>
                        </div>
                    </div>
                    <!-- last part -->
                    <div class="flex items-center gap-x-3 text-[16px] text-description mt-4">
                        <div class="flex items-center gap-x-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <p>No Card required</p>
                        </div>
                        <div class="flex items-center gap-x-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <p>Fast acceptance</p>
                        </div>
                    </div>
                </div>
                <!-- hero image  -->
                <div class="grow flex justify-center lg:justify-start">
                    <img src="./images/hero.png" alt="">
                </div>
            </div>
        </section>
    
    </header>
</body>
</html>
